<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cornhole249 — Hamilton's Most Competitive Backyard League</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cornhole249" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Theme colour (matches navbar) -->
    <meta name="theme-color" content="#4A3728" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Nunito:wght@400;500;600;700;800&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
  <style>
    body { background-color: #F5EFE0; margin: 0; }
    #pre-load {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #F5EFE0;
      font-family: 'Abril Fatface', serif;
      color: #5C3A1E;
      font-size: 1.8rem;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.2s;
    }
  </style>
  </head>
  <body>
    <div id="pre-load">Cornhole249</div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
