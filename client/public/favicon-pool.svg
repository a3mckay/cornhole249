<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Felt-green rounded background (pool table) -->
  <rect width="32" height="32" rx="7" fill="#14342a"/>
  <!-- Cue ball shadow ring -->
  <circle cx="16" cy="16" r="11" fill="#0d251d"/>
  <!-- The 8-ball -->
  <circle cx="16" cy="16" r="9.5" fill="#15110f"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#000" stroke-width="0.6" opacity="0.5"/>
  <!-- Glare highlight -->
  <ellipse cx="12.5" cy="12" rx="2.4" ry="1.6" fill="#ffffff" opacity="0.45"/>
  <!-- White circle with the 8 -->
  <circle cx="16" cy="16" r="4.6" fill="#FDFBF6"/>
  <text x="16" y="19.4" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="700"
        text-anchor="middle" fill="#15110f">8</text>
</svg>
